
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday, Ronika!</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: Georgia, serif;
      background:
        radial-gradient(ellipse at 50% 35%, #66656b, transparent 65%),
        linear-gradient(145deg, #252529, #45444a, #29282d);
      color: white;
    }

    .scene {
      text-align: center;
      padding: 24px;
      perspective: 1000px;
      width: 100%;
    }

    .subtitle {
      font-family: Arial, sans-serif;
      font-size: 10px;
      letter-spacing: 5px;
      color: #e9cbd3;
      margin-bottom: 45px;
      text-transform: uppercase;
    }

    .envelope {
      position: relative;
      width: min(340px, 84vw);
      height: 220px;
      margin: 0 auto;
      cursor: pointer;
      filter: drop-shadow(0 25px 35px #10080c88);
      transition: transform .4s ease;
    }

    .envelope:hover {
      transform: translateY(-7px);
    }

    .back {
      position: absolute;
      inset: 0;
      border-radius: 9px;
      background: linear-gradient(135deg, #fffaf8, #d8cbd0);
    }

    .letter {
      position: absolute;
      left: 7%;
      top: 7%;
      width: 86%;
      height: 84%;
      background: linear-gradient(145deg, #fff, #f2e7eb);
      color: #702039;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 15px;
      border: 1px solid #d7a6b5;
      border-radius: 4px;
      transition: transform .8s ease;
    }

    .letter h1 {
      font-size: clamp(22px, 6vw, 29px);
      margin: 8px 0;
      line-height: 1.3;
    }

    .letter p {
      font: 12px Arial, sans-serif;
      letter-spacing: 3px;
      margin: 8px 0;
    }

    .pony {
      color: #fff;
      font-size: 12px;
      text-shadow: 0 1px 3px #8c2444;
      letter-spacing: 7px;
    }

    .front {
      position: absolute;
      inset: 0;
      overflow: hidden;
      border-radius: 9px;
      background: linear-gradient(145deg, #a83b59, #711d39 70%);
      clip-path: polygon(0 0, 50% 53%, 100% 0, 100% 100%, 0 100%);
      z-index: 2;
      border-bottom: 2px solid #e8c5ce;
    }

    .flap {
      position: absolute;
      inset: 0;
      background: linear-gradient(160deg, #fff9fa, #d7c2cb);
      clip-path: polygon(0 0, 100% 0, 50% 58%);
      transform-origin: top;
      transition: transform .8s ease;
      z-index: 3;
      backface-visibility: hidden;
    }

    .seal {
      position: absolute;
      z-index: 4;
      left: 50%;
      top: 58%;
      transform: translate(-50%, -50%);
      width: 47px;
      height: 47px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: linear-gradient(145deg, #fff, #e8dce1);
      border: 2px solid #d8a8b7;
      color: #852440;
      font-size: 20px;
      box-shadow: 0 0 20px #ffcfdf55;
      transition: opacity .3s ease;
    }

    .glass {
      position: relative;
      padding: 45px 20px 28px;
      margin: 0 auto;
      max-width: 440px;
      background: #ffffff0a;
      border: 1px solid #ffffff28;
      border-radius: 22px;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: 0 20px 60px #0002;
    }

    .hint {
      margin-top: 32px;
      font: 11px Arial, sans-serif;
      letter-spacing: 3px;
      color: #f0dce2;
      animation: pulse 2s infinite;
    }

    .opened .flap {
      transform: rotateX(180deg);
      z-index: 0;
    }

    .opened .letter {
      transform: translateY(-115px);
      transition-delay: .3s;
    }

    .opened .seal {
      opacity: 0;
    }

    .opened .front {
      z-index: 1;
    }

    .opened .letter {
      z-index: 2;
    }

    .next {
      display: none;
      margin-top: 135px;
      color: #fff;
      text-decoration: none;
      font: 11px Arial, sans-serif;
      letter-spacing: 4px;
      padding: 15px 22px;
      border: 1px solid #d98ba2;
      border-radius: 30px;
      background: #8d234333;
      cursor: pointer;
    }

    .opened ~ .next {
      display: inline-block;
      animation: fadeIn 1.5s ease both;
    }

    @keyframes pulse {
      50% { opacity: .5; }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 400px) {
      .envelope { height: 190px; }
      .glass { padding-top: 35px; }
      .opened .letter { transform: translateY(-95px); }
    }
  </style>
</head>

<body>
  <main class="scene">
    <div class="subtitle">A little birthday surprise</div>

    <section class="glass">
      <div class="envelope" id="envelope" role="button"
           tabindex="0" aria-label="Open the birthday envelope">
        <div class="back"></div>

        <div class="letter">
          <div class="pony">♘ · ♘ · ♘</div>
          <h1>Happy Birthday,<br>Ronika</h1>
          <p>FROM NIMA</p>
          <div class="pony">♘ · ♘ · ♘</div>
        </div>

        <div class="flap"></div>
        <div class="front"></div>
        <div class="seal">✦</div>
      </div>
    </section>

    <div class="hint" id="hint">TAP TO OPEN YOUR GIFT</div>

    <button class="next" id="next">
      ENTER THE EXPERIENCE &nbsp; ↗
    </button>
  </main>

  <script>
    const envelope = document.getElementById("envelope");
    const hint = document.getElementById("hint");
    const next = document.getElementById("next");

    function openEnvelope() {
      if (envelope.classList.contains("opened")) return;

      envelope.classList.add("opened");
      hint.textContent = "";
    }

    envelope.addEventListener("click", openEnvelope);

    envelope.addEventListener("keydown", (event) => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        openEnvelope();
      }
    });

    next.addEventListener("click", () => {
      alert("The next chapter is coming soon...");
    });
  </script>
</body>
</html>
