```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday, Ronika!</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      overflow-y: auto;
      font-family: Georgia, serif;
      background:
        radial-gradient(ellipse at 50% 35%, #66656b, transparent 65%),
        linear-gradient(145deg, #252529, #45444a, #29282d);
      color: white;
    }

    .scene {
      text-align: center;
      padding: 30px 16px;
      perspective: 1000px;
      width: 100%;
      max-width: 520px;
      margin: auto;
    }

    .subtitle {
      font-family: Arial, sans-serif;
      font-size: 10px;
      letter-spacing: 4px;
      line-height: 1.8;
      color: #e9cbd3;
      margin: 0 auto 32px;
      text-transform: uppercase;
      transition: opacity .5s ease, transform .5s ease;
    }

    .scene.opened .subtitle {
      opacity: 0;
      transform: translateY(-10px);
      pointer-events: none;
    }

    .glass {
      position: relative;
      width: 100%;
      max-width: 440px;
      margin: 0 auto;
      padding: 40px 16px 26px;
      background: #ffffff0a;
      border: 1px solid #ffffff28;
      border-radius: 22px;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: 0 20px 60px #0002;
    }

    .envelope {
      position: relative;
      width: min(340px, 100%);
      height: 220px;
      margin: 0 auto;
      cursor: pointer;
      isolation: isolate;
      filter: drop-shadow(0 25px 25px #10080c66);
      -webkit-tap-highlight-color: transparent;
    }

    .back {
      position: absolute;
      inset: 0;
      border-radius: 9px;
      background: linear-gradient(135deg, #fffaf8, #d8cbd0);
      z-index: 0;
    }

    .letter {
      position: absolute;
      left: 7%;
      top: 7%;
      width: 86%;
      height: 84%;
      background: linear-gradient(145deg, #fff, #f2e7eb);
      color: #702039;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px;
      border: 1px solid #d7a6b5;
      border-radius: 4px;
      z-index: 1;
      transition: transform .8s ease;
    }

    .letter h1 {
      font-size: clamp(22px, 6vw, 29px);
      margin: 8px 0;
      line-height: 1.3;
    }

    .letter p {
      font: 12px Arial, sans-serif;
      letter-spacing: 3px;
      margin: 8px 0;
    }

    .pony {
      color: #fff;
      font-size: 12px;
      text-shadow: 0 1px 3px #8c2444;
      letter-spacing: 7px;
    }

    .front {
      position: absolute;
      inset: 0;
      overflow: hidden;
      border-radius: 9px;
      background: linear-gradient(145deg, #a83b59, #711d39 70%);
      clip-path: polygon(0 0, 50% 53%, 100% 0, 100% 100%, 0 100%);
      z-index: 2;
      border-bottom: 2px solid #e8c5ce;
      pointer-events: none;
    }

    .flap {
      position: absolute;
      inset: 0;
      background: linear-gradient(160deg, #fff9fa, #d7c2cb);
      clip-path: polygon(0 0, 100% 0, 50% 58%);
      transform-origin: top center;
      transition: transform .8s ease;
      z-index: 3;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      pointer-events: none;
    }

    .seal {
      position: absolute;
      z-index: 4;
      left: 50%;
      top: 58%;
      transform: translate(-50%, -50%);
      width: 47px;
      height: 47px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: linear-gradient(145deg, #fff, #e8dce1);
      border: 2px solid #d8a8b7;
      color: #852440;
      font-size: 20px;
      box-shadow: 0 0 20px #ffcfdf55;
      transition: opacity .3s ease;
      pointer-events: none;
    }

    .hint {
      margin-top: 28px;
      font: 11px Arial, sans-serif;
      letter-spacing: 3px;
      line-height: 1.8;
      color: #f0dce2;
      animation: pulse 2s infinite;
      transition: opacity .4s ease;
    }

    .scene.opened .hint {
      opacity: 0;
      animation: none;
    }

    .envelope.opened .flap {
      transform: rotateX(180deg);
      z-index: 0;
    }

    .envelope.opened .letter {
      transform: translateY(-115px);
      transition-delay: .3s;
      z-index: 3;
    }

    .envelope.opened .seal {
      opacity: 0;
    }

    .envelope.opened .front {
      z-index: 2;
    }

    .next {
      display: none;
      margin: 35px auto 0;
      max-width: 100%;
      color: #fff;
      font: 11px Arial, sans-serif;
      letter-spacing: 3px;
      line-height: 1.7;
      padding: 15px 20px;
      border: 1px solid #d98ba2;
      border-radius: 30px;
      background: #8d234333;
      cursor: pointer;
    }

    .scene.opened .next {
      display: inline-block;
      animation: fadeIn 1.5s ease both;
    }

    @keyframes pulse {
      50% { opacity: .5; }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 400px) {
      .scene {
        padding: 24px 14px;
      }

      .glass {
        padding: 32px 12px 24px;
      }

      .subtitle {
        margin-bottom: 26px;
        letter-spacing: 3px;
      }

      .envelope {
        height: 190px;
      }

      .envelope.opened .letter {
        transform: translateY(-95px);
      }

      .next {
        letter-spacing: 2px;
        padding: 13px 15px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>

  <audio id="birthdayMusic" preload="auto" loop>
    <source src="./2_5325765670447644195.mp3" type="audio/mpeg">
  </audio>

  <audio id="music2" preload="none">
    <source src="./For%20the%20First%20Time.mp3" type="audio/mpeg">
  </audio>

  <audio id="music3" preload="none">
    <source src="./bedrott%20duskydemise%20(1).m4a" type="audio/mp4">
  </audio>

  <audio id="music4" preload="none">
    <source src="./ha%20ha%20ha%20(1).m4a" type="audio/mp4">
  </audio>

  <main class="scene" id="scene">
    <div class="subtitle">A little birthday surprise</div>

    <section class="glass">
      <div class="envelope" id="envelope"
           role="button" tabindex="0"
           aria-label="Open the birthday envelope">

        <div class="back"></div>

        <div class="letter">
          <div class="pony">♘ · ♘ · ♘</div>
          <h1>Happy Birthday,<br>Ronika</h1>
          <p>FROM NIMA</p>
          <div class="pony">♘ · ♘ · ♘</div>
        </div>

        <div class="flap"></div>
        <div class="front"></div>
        <div class="seal">✦</div>
      </div>
    </section>

    <div class="hint" id="hint">TAP TO OPEN YOUR GIFT</div>

    <button class="next" id="next">
      ENTER THE EXPERIENCE &nbsp; ↗
    </button>
  </main>

  <script>
    const scene = document.getElementById("scene");
    const envelope = document.getElementById("envelope");
    const hint = document.getElementById("hint");
    const next = document.getElementById("next");
    const music = document.getElementById("birthdayMusic");

    function openEnvelope() {
      if (envelope.classList.contains("opened")) return;

      envelope.classList.add("opened");
      scene.classList.add("opened");
      hint.textContent = "";

      music.play().catch((error) => {
        console.log("Music playback failed:", error);
      });
    }

    envelope.addEventListener("click", openEnvelope);

    envelope.addEventListener("keydown", (event) => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        openEnvelope();
      }
    });

    next.addEventListener("click", () => {
      alert("The next chapter is coming soon...");
    });
  </script>

</body>
</html>
